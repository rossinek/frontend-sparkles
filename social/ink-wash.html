<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Ink Wash — OG artwork</title>
<style>
@font-face { font-family: Manrope; src: url('../particle-flip/public/fonts/manrope.ttf'); font-weight: 200 800; }
* { box-sizing: border-box; }
body { position: relative; width: 1200px; height: 630px; margin: 0; overflow: hidden; background: #141618; font-family: Manrope, sans-serif; }
.scene { position: absolute; top: 20px; left: 90px; width: 1020px; height: 450px; }
.print { position: absolute; width: 520px; box-shadow: 0 18px 44px rgb(0 0 0 / .5); }
.print img { display: block; width: 100%; height: auto; }
.print span { position: absolute; top: 14px; left: 14px; padding: 6px 14px; color: #f6f6ee; background: rgb(20 22 24 / .7); border-radius: 100px; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; }
.before { top: 6px; left: 6px; transform: rotate(-2.5deg); }
.after { top: 98px; left: 494px; box-shadow: 0 6px 16px rgb(0 0 0 / .55), 0 30px 70px rgb(0 0 0 / .8); transform: rotate(1.8deg); }
.badge { position: absolute; top: 38px; right: 40px; display: flex; align-items: center; gap: 10px; color: #f6f6ee; background: #202322; border: 1px solid #50574f; padding: 18px 26px; border-radius: 100px; font-size: 28px; font-weight: 600; letter-spacing: -.4px; }
.badge svg { width: 30px; height: 30px; color: #cbdebc; }
h1 { position: absolute; bottom: 0; left: 0; width: 100%; height: 140px; margin: 0; padding: 0 64px; display: flex; align-items: center; justify-content: center; color: #fff; background: #000; font-size: 46px; font-weight: 300; text-transform: uppercase; letter-spacing: 28px; line-height: 1.2; }

</style>
<body><div class="scene"><div class="print before"><img src="../ink-wash/public/example/before.jpg" alt="A woman in a black hat on a city street, her hair blown by the wind"><span>Before</span></div><div class="print after"><img src="../ink-wash/public/example/after.jpg" alt="The same photo as a sepia ink painting over a pencil sketch"><span>After</span></div></div><div class="badge"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2v20M2 12h20M5 5l14 14M5 19L19 5" stroke="currentColor" stroke-width="1.5"/></svg>Frontend Sparkles</div><h1>Ink Wash</h1></body>
</html>
